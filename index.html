<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parliamo — итальянский с нуля</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#1E5A7A">
<meta name="apple-mobile-web-app-title" content="Parliamo">
<meta name="description" content="Italian for beginners: short lessons, spaced review and AI voices. Интерфейс на русском и английском.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F4; --surface:#FFFFFF; --ink:#14202B; --muted:#5B6873; --line:#D3DCE1;
  --sea:#1E5A7A; --sea-ink:#FFFFFF; --lemon:#F2C230; --lemon-soft:#FBF0C6;
  --olive:#3F7A35; --ok-bg:#E3F0DD; --brick:#B5452C; --bad-bg:#F8E1DA;
  --sky:#D5E6EE; --hill:#B9CFA8; --cliff:#D8C3A0; --house1:#F4D9A6; --house2:#E9A38A; --house3:#FBF3E4; --sea2:#2C6F93; --pic-bg:#FBF0C6;
  --tabh:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1920; --surface:#16252F; --ink:#E7EEF1; --muted:#94A4AF; --line:#25394A;
    --sea:#6FB3D6; --sea-ink:#0E1920; --lemon:#F2C230; --lemon-soft:#3A3417;
    --olive:#8DC273; --ok-bg:#1D3320; --brick:#E8826A; --bad-bg:#3B201A;
    --sky:#132532; --hill:#25402F; --cliff:#4A3E2C; --house1:#8C7140; --house2:#8A4B3A; --house3:#A89C88; --sea2:#3D86AE; --pic-bg:#26332F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1920; --surface:#16252F; --ink:#E7EEF1; --muted:#94A4AF; --line:#25394A;
  --sea:#6FB3D6; --sea-ink:#0E1920; --lemon:#F2C230; --lemon-soft:#3A3417;
  --olive:#8DC273; --ok-bg:#1D3320; --brick:#E8826A; --bad-bg:#3B201A;
  --sky:#132532; --hill:#25402F; --cliff:#4A3E2C; --house1:#8C7140; --house2:#8A4B3A; --house3:#A89C88; --sea2:#3D86AE; --pic-bg:#26332F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
.it{font-family:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;font-optical-sizing:auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--lemon);outline-offset:2px;border-radius:6px}
main{max-width:560px;margin:0 auto;padding:20px 20px calc(var(--tabh) + 32px)}
.view[hidden]{display:none}
.lead{color:var(--muted);margin:6px 0 0;max-width:36ch}

/* Course */
.greet{font-size:clamp(3.2rem,15vw,4.6rem);font-style:italic;font-weight:500;line-height:1;margin:8px 0 6px;letter-spacing:-.01em}
.stats{display:flex;gap:28px;margin:22px 0 30px;padding:0}
.stats div{margin:0}
.stats dt{font-size:.8rem;color:var(--muted)}
.stats dd{margin:0;font-size:1.6rem;font-weight:600}
.path{list-style:none;margin:0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:var(--line)}
.path li{position:relative}
.lrow{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:12px 0}
.num{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--bg);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1}
.done .num{background:var(--olive);border-color:var(--olive);color:var(--surface)}
.current .num{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
.ltext{flex:1;display:flex;flex-direction:column;min-width:0}
.ltitle{font-size:1.45rem;line-height:1.2}
.lsub{font-size:.88rem;color:var(--muted)}
.locked .ltitle{color:var(--muted)}
.go{flex:none;background:var(--lemon);color:#14202B;font-weight:600;font-size:.9rem;padding:8px 14px;border-radius:999px}
.current .lrow{padding:16px 14px 16px 0}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs-in{display:flex;width:100%;max-width:560px}
.tab{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--sea);font-weight:600}
.tab .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--brick);color:#fff;font-size:.68rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* Settings */
.chome{position:relative}
.topctl{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.tab .badge[hidden]{display:none}
.langsw{display:flex;background:var(--surface);border-radius:999px;padding:3px}
.langsw button{font-size:.8rem;font-weight:600;padding:7px 11px;border-radius:999px;color:var(--muted)}
.langsw button[aria-pressed="true"]{background:var(--sea);color:var(--sea-ink)}
.gear{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--sea)}
.gear svg{width:22px;height:22px}
#settings{position:fixed;inset:0;background:var(--bg);z-index:12;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#settings[hidden]{display:none}
.stitle-top{font-weight:600;font-size:1.1rem}
.vlist{display:grid;gap:8px;margin:12px 0 26px}
.vrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.vrow[aria-checked="true"]{border-color:var(--sea);box-shadow:inset 0 0 0 1px var(--sea)}
.vpick{flex:1;text-align:left;display:flex;flex-direction:column;min-width:0}
.vname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vmeta{font-size:.82rem;color:var(--muted)}
.vmeta b{color:var(--olive);font-weight:600}
.h3{font-weight:600;margin:6px 0 4px}
.muted{color:var(--muted);font-size:.92rem;margin:0}
.rate{display:flex;align-items:center;gap:12px;margin:12px 0 8px}
.rate input{flex:1;accent-color:var(--sea)}
.rate output{min-width:3.5em;text-align:right;font-weight:600}
.help{background:var(--surface);border-radius:14px;padding:14px 16px;font-size:.92rem;margin-top:8px}
.help p{margin:0 0 8px}.help p:last-child{margin:0}

/* Lesson overlay */
#lesson{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#lesson[hidden]{display:none}
.ltop{display:flex;align-items:center;gap:14px;padding:14px 20px;max-width:560px;width:100%;margin:0 auto}
.x{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.x svg{width:22px;height:22px}
.track{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
#bar{height:100%;width:0;background:var(--olive);border-radius:5px;transition:width .3s ease}
.lbody{flex:1;overflow-y:auto;padding:12px 20px 20px;max-width:560px;width:100%;margin:0 auto}
.lfoot{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;width:100%;margin:0 auto}
.kicker{color:var(--muted);margin:8px 0 18px;font-weight:500}
.big{font-size:clamp(2.6rem,12vw,3.6rem);font-style:italic;font-weight:500;line-height:1.05;margin:0}
.ru-sub{font-size:1.2rem;margin:6px 0 24px;color:var(--muted)}
.tip{background:var(--surface);border-left:4px solid var(--lemon);padding:16px 18px;border-radius:4px 12px 12px 4px;line-height:1.6}
.word{font-size:clamp(2.3rem,11vw,3.2rem);font-weight:500;line-height:1.1;margin:18px 0 8px}
.trans{font-size:1.25rem;margin:0}
.say{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--sea);color:var(--sea-ink);flex:none}
.say svg{width:22px;height:22px}
.big-say{width:72px;height:72px}
.big-say svg{width:34px;height:34px}
.say.sm{width:32px;height:32px}
.say.sm svg{width:17px;height:17px}
.prompt{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.pword{font-size:2rem;line-height:1.15}
.pru{font-size:1.45rem;font-weight:500;margin:0 0 24px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.05rem;transition:border-color .15s}
.opt.it{font-size:1.3rem}
.opt[aria-pressed="true"]{border-color:var(--sea);background:var(--surface);box-shadow:inset 0 0 0 1px var(--sea)}
.opt.right{border-color:var(--olive);background:var(--ok-bg)}
.opt.wrong{border-color:var(--brick);background:var(--bad-bg)}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:24px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tok{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 14px;font-size:1.3rem}
.tok.ghost{visibility:hidden}
.fb{border-radius:14px;padding:12px 16px;margin-bottom:12px;font-weight:500}
.fb[hidden]{display:none}
.fb.ok{background:var(--ok-bg);color:var(--olive)}
.fb.bad{background:var(--bad-bg);color:var(--brick)}
.fb .it{font-size:1.2rem;display:block;color:var(--ink);font-weight:500}
.primary{width:100%;background:var(--sea);color:var(--sea-ink);font-weight:600;font-size:1.05rem;padding:16px;border-radius:14px}
.primary:disabled{opacity:.4}
.result{font-size:1.1rem}

/* Review */
.rv-head{margin:18px 0 26px}
.rv-head h1{font-size:2.6rem;font-style:italic;font-weight:500;margin:0;line-height:1.1}
.bignum{font-size:4.5rem;font-weight:700;line-height:1;margin:0;color:var(--sea)}
.empty{background:var(--surface);border-radius:16px;padding:22px}
.empty p{margin:0 0 16px}
.rv-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin:10px 0 18px}
.flash{background:var(--surface);border-radius:20px;padding:30px 22px;text-align:center;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:18px}
.flash .word{margin:18px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.secondary{background:var(--surface);border:2px solid var(--line);font-weight:600;padding:14px;border-radius:14px}
.link{color:var(--sea);font-weight:600}
.tap{cursor:pointer;text-decoration:underline dotted var(--muted);text-decoration-thickness:2px;text-underline-offset:.22em;border-radius:6px;-webkit-tap-highlight-color:transparent}
.tap.speaking{color:var(--sea);text-decoration-color:var(--sea)}
.say.speaking{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--sea)}50%{box-shadow:0 0 0 8px transparent}}
.pron{color:var(--muted);font-size:1.1rem;margin:2px 0 14px;letter-spacing:.01em}
.fb .pron{font-size:.95rem;margin:2px 0 0;font-weight:400}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:14px;font-size:.92rem;z-index:20}
.toast[hidden]{display:none}

/* Chat */
.chead h1{font-size:clamp(2.8rem,13vw,3.8rem);font-style:italic;font-weight:500;margin:18px 0 4px;line-height:1}
.scen{display:grid;gap:12px;margin-top:26px}
.scard{text-align:left;background:var(--surface);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:2px;border:2px solid transparent}
.scard:hover{border-color:var(--line)}
.stitle{font-size:1.5rem}
.sdesc{color:var(--muted);font-size:.93rem}
.notice{margin-top:20px;color:var(--muted);font-size:.9rem}
.chatbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 16px}
.chatbar .it{font-size:1.3rem;font-style:italic}
.msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.msg{max-width:86%;border-radius:18px;padding:12px 15px}
.msg p{margin:0}
.msg.ai{background:var(--surface);align-self:flex-start;border-bottom-left-radius:6px}
.msg.ai .it,.msg.me .it{font-size:1.2rem;line-height:1.35}
.msg.me{background:var(--sea);color:var(--sea-ink);align-self:flex-end;border-bottom-right-radius:6px}
.mtools{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:.88rem}
.mru{color:var(--muted);margin-top:6px!important;font-size:.95rem}
.corr{align-self:flex-end;max-width:86%;background:var(--lemon-soft);border-radius:12px;padding:10px 14px;font-size:.93rem}
.corr strong{display:block;font-size:.82rem;margin-bottom:2px}
.typing{align-self:flex-start;color:var(--muted);font-style:italic;padding:4px 6px}
.composer{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 8px}
.hints{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.hints::-webkit-scrollbar{display:none}
.hint{flex:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;max-width:240px}
.hint .it{font-size:1.05rem}
.hru{font-size:.78rem;color:var(--muted)}
.crow{display:flex;gap:8px}
.crow input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.crow input:focus{outline:none;border-color:var(--sea)}
.send{width:50px;border-radius:14px;background:var(--sea);color:var(--sea-ink);display:grid;place-items:center}
.send svg{width:22px;height:22px}
.cerr{color:var(--brick);font-size:.9rem;margin:0 0 8px}
.cerr:empty{display:none}

/* Visuals */
.postcard{display:block;width:100%;height:auto;aspect-ratio:400/120;max-width:100%;border-radius:18px;margin:20px 0 4px}
.pc-sky{fill:var(--sky)}.pc-sun{fill:var(--lemon)}.pc-hill{fill:var(--hill)}.pc-cliff{fill:var(--cliff)}
.pc-houses .h1{fill:var(--house1)}.pc-houses .h2{fill:var(--house2)}.pc-houses .h3,.pc-houses .h4{fill:var(--house3)}
.pc-win rect{fill:var(--sea)}
.pc-sea{fill:var(--sea)}.pc-sea2{fill:var(--sea2)}
.pc-boat path{fill:var(--brick)}.pc-boat .sail{fill:var(--house3)}
@media (prefers-reduced-motion: no-preference){
  .pc-boat{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .pc-sea2{animation:drift 6s ease-in-out infinite}
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2px) rotate(2deg)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
.week{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-12px 0 18px;flex-wrap:wrap}
.wlbl{font-size:.8rem;color:var(--muted)}
.wdays{display:flex;gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;color:var(--muted);letter-spacing:.02em}
.wd i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.75rem;font-weight:700;color:var(--surface)}
.wd.on i{background:var(--olive);border-color:var(--olive)}
.wd.today i{border-color:var(--sea)}
.wd.today{color:var(--ink);font-weight:600}
.wd.future i{border-style:dashed}
.cprog{margin:0 0 28px}
.cprog-top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums}
.cprog .track>div{height:100%;background:var(--olive);border-radius:5px;transition:width .4s ease}
.emb{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-size:1.3rem}
.locked .emb{opacity:.6;filter:grayscale(1)}
.emblem{width:84px;height:84px;border-radius:24px;background:var(--pic-bg);display:grid;place-items:center;font-size:2.8rem;margin:10px 0 6px}
.pic{flex:none;display:inline-grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--pic-bg);font-size:1.9rem;line-height:1}
.pic.lg{width:96px;height:96px;border-radius:26px;font-size:3.2rem}
.pic.digit{font-family:'Bodoni Moda',Georgia,serif;font-style:italic;font-weight:600;color:var(--sea);font-size:2rem}
.pic.lg.digit{font-size:3.4rem}
.pic.swatch{background:var(--sw);box-shadow:inset 0 0 0 2px var(--line)}
.learnrow{display:flex;align-items:center;gap:16px}
.prow{display:flex;align-items:center;gap:14px;margin:0 0 24px}
.prow .pru{margin:0}
.flash .pic.lg{margin-bottom:14px}
.sfxrow{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);border-radius:14px;padding:12px 16px;margin:0 0 26px;cursor:pointer}
.sfxrow>span{display:flex;flex-direction:column;min-width:0}
.sfxrow .h3{margin:0}
.sfxrow input{width:22px;height:22px;accent-color:var(--sea);flex:none}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
  <section class="view" id="view-course"></section>
  <section class="view" id="view-review" hidden></section>
  <section class="view" id="view-chat" hidden></section>
</main>

<nav class="tabs" id="tabs">
  <div class="tabs-in">
    <button class="tab" data-action="tab" data-tab="course" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6.5A2.5 2.5 0 0 0 4 21.5v-2z"/><path d="M8 7h8M8 11h6"/></svg><span data-t="tabCourse"></span></button>
    <button class="tab" data-action="tab" data-tab="review">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg><span data-t="tabReview"></span><span class="badge" id="badge" hidden></span></button>
    <button class="tab" data-action="tab" data-tab="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg><span data-t="tabChat"></span></button>
  </div>
</nav>

<div class="toast" id="toast" role="status" hidden></div>
<div id="settings" hidden role="dialog" aria-modal="true">
  <div class="ltop"><button class="x" data-action="settings-close" id="settingsX"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span class="stitle-top" data-t="settingsTitle"></span></div>
  <div class="lbody" id="sbody"></div>
</div>
<div id="lesson" hidden role="dialog" aria-modal="true">
  <div class="ltop">
    <button class="x" data-action="lesson-close" id="lessonX"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="track"><div id="bar"></div></div>
  </div>
  <div class="lbody" id="lbody"></div>
  <div class="lfoot">
    <div class="fb" id="fb" hidden></div>

  const clip = clipUrl(text, aiVoice || S.aiVoice);
  if (clip) {
    try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
    const a = new Audio(clip); curAudio = a;
    a.playbackRate = Math.min(1.25, Math.max(0.7, (S.rate || 0.85) / 0.85));
    if (el) { el.classList.add('speaking'); speakingEl = el; }
    const off = () => { if (el) el.classList.remove('speaking'); if (speakingEl === el) speakingEl = null; };
    a.onended = off;
    a.onerror = () => { off(); if (curAudio === a) { curAudio = null; speakSystem(text, el, byUser); } };
    a.play().catch(err => { off(); if (err && err.name !== 'AbortError' && curAudio === a) { curAudio = null; speakSystem(text, el, byUser); } });
    return;
  }
  speakSystem(text, el, byUser);
}
function speakSystem(text, el, byUser){
  if (!('speechSynthesis' in window)) { if (byUser) toast(L().toastNoTts); return; }
  if (!itVoice) pickVoice();
  if (byUser && !warned && !itVoice && speechSynthesis.getVoices().length) {
    warned = true;
    toast(L().toastNoIt);
  }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/…/g, ''));
    u.lang = 'it-IT'; if (itVoice) u.voice = itVoice; u.rate = S.rate || 0.85;
    let started = false;
    u.onstart = () => { started = true; if (el) { el.classList.add('speaking'); speakingEl = el; } };
    u.onend = u.onerror = () => { if (el) el.classList.remove('speaking'); if (speakingEl === el) speakingEl = null; };
    if (speechSynthesis.paused) speechSynthesis.resume();
    speechSynthesis.speak(u);
    if (byUser) setTimeout(() => { if (!started && !speechSynthesis.speaking) toast(L().toastSilent); }, 1800);
  } catch (e) {}
}

let R = null;
function startLesson(id){
  const lesson = LESSONS.find(l => l.id === id);
  const types = ['pick_tr','pick_it','listen','build'];
  const ex = shuffle(lesson.items).map((item, i) => {
    let t = types[i % 4];
    if (t === 'build' && item.it.trim().split(/\s+/).length < 2) t = 'pick_it';
    return {type:t, item};
  });
  R = {lesson, steps:[{type:'tip'}, ...lesson.items.map(item => ({type:'learn', item})), ...ex], i:0, first:0, total:ex.length, sel:null, built:[], toks:[], mode:'next'};
  $('#lesson').hidden = false; document.body.classList.add('locked');
  showStep();
}
function closeLesson(){
  R = null; $('#lesson').hidden = true; document.body.classList.remove('locked');
  stopAudio();
  renderCourse();
}
function options(item, get){
  const pool = shuffle(R.lesson.items.filter(x => x !== item).map(get));
  const extra = shuffle(LESSONS.flatMap(l => l.items).filter(x => x !== item).map(get));
  const set = [];
  for (const v of [...pool, ...extra]) { if (v !== get(item) && !set.includes(v)) set.push(v); if (set.length === 3) break; }
  return shuffle([get(item), ...set]);
}
function setBtn(text, mode, disabled){ const b = $('#lbtn'); b.textContent = text; b.disabled = !!disabled; R.mode = mode; }
function showStep(){
  const st = R.steps[R.i], item = st.item, body = $('#lbody');
  R.sel = null; R.built = [];
  $('#bar').style.width = (R.i / R.steps.length * 100) + '%';
  $('#fb').hidden = true;
  let html = '';
  if (st.type === 'tip') {
    const n = LESSONS.indexOf(R.lesson) + 1;
    html = `<div class="emblem" aria-hidden="true">${EMBLEM[R.lesson.id] || ''}</div><p class="kicker">${L().lessonN(n)}</p><h2 class="it big">${R.lesson.it}</h2><p class="ru-sub">${esc(tr(R.lesson))}</p><div class="tip">${esc(S.lang === 'en' ? R.lesson.tipEn : R.lesson.tip)}</div>`;
    setBtn(L().start, 'next');
  } else if (st.type === 'learn') {
    html = `<p class="kicker">${L().kLearn}</p><div class="learnrow">${picHtml(item.it, 'lg')}<button class="say big-say" data-say="${esc(item.it)}" aria-label="${L().listen}">${ICON_SAY}</button></div><h2 class="it word"><span class="tap" role="button" tabindex="0" data-say="${esc(item.it)}">${esc(item.it)}</span></h2>${pronHtml(item.it)}<p class="trans">${esc(tr(item))}</p>`;
    setBtn(L().next, 'next'); speak(item.it);
  } else if (st.type === 'pick_tr') {
    html = `<p class="kicker">${L().kPickTr}</p><div class="prompt"><button class="say" data-say="${esc(item.it)}" aria-label="${L().listen}">${ICON_SAY}</button><span class="it pword tap" role="button" tabindex="0" data-say="${esc(item.it)}">${esc(item.it)}</span></div>
      <div class="opts">${options(item, tr).map(v => `<button class="opt" data-action="opt" data-val="${esc(v)}" aria-pressed="false">${esc(v)}</button>`).join('')}</div>`;
    setBtn(L().check, 'check', true); speak(item.it);
  } else if (st.type === 'pick_it' || st.type === 'listen') {
    const head = st.type === 'pick_it'
      ? `<p class="kicker">${L().kPickIt}</p><div class="prow">${picHtml(item.it)}<p class="pru">${esc(tr(item))}</p></div>`
      : `<p class="kicker">${L().kListen}</p><div class="prompt"><button class="say big-say" data-say="${esc(item.it)}" aria-label="${L().listenAgain}">${ICON_SAY}</button></div>`;
    html = head + `<div class="opts">${options(item, x => x.it).map(v => `<button class="opt it" data-action="opt" data-val="${esc(v)}" aria-pressed="false">${esc(v)}</button>`).join('')}</div>`;
    setBtn(L().check, 'check', true);
    if (st.type === 'listen') setTimeout(() => speak(item.it), 250);
  } else if (st.type === 'build') {
    const words = item.it.split(/\s+/);
    const others = shuffle(LESSONS.flatMap(l => l.items).filter(x => x !== item).flatMap(x => x.it.split(/\s+/)))
      .filter(w => !words.map(norm).includes(norm(w)));
    const extra = [...new Set(others)].slice(0, 2);
    R.toks = shuffle([...words, ...extra]).map((t, id) => ({id, t}));
    html = `<p class="kicker">${L().kBuild}</p><p class="pru">${esc(tr(item))}</p><div class="answer" id="ans"></div><div class="bank" id="bank"></div>`;
    setBtn(L().check, 'check', true);
  }
  body.innerHTML = html; body.scrollTop = 0;
  if (st.type === 'build') renderBuild();
}
function renderBuild(){
  $('#ans').innerHTML = R.built.map(id => `<button class="tok it" data-action="unpick" data-id="${id}">${esc(R.toks[id].t)}</button>`).join('');
  $('#bank').innerHTML = R.toks.map(tk => `<button class="tok it ${R.built.includes(tk.id) ? 'ghost' : ''}" data-action="pick" data-id="${tk.id}" ${R.built.includes(tk.id) ? 'tabindex="-1" aria-hidden="true"' : ''}>${esc(tk.t)}</button>`).join('');
  if (R.mode === 'check') $('#lbtn').disabled = R.built.length === 0;
}
function check(){
  const st = R.steps[R.i], item = st.item;
  let ok, correct;
  if (st.type === 'build') {
    ok = norm(R.built.map(id => R.toks[id].t).join(' ')) === norm(item.it);
    correct = item.it;
    document.querySelectorAll('.tok').forEach(b => b.disabled = true);
  } else {
    correct = st.type === 'pick_tr' ? tr(item) : item.it;
    ok = R.sel === correct;
    document.querySelectorAll('.opt').forEach(b => {
      b.disabled = true;
      if (b.dataset.val === correct) b.classList.add('right');
      else if (b.dataset.val === R.sel) b.classList.add('wrong');
    });
  }
  const fb = $('#fb');
  fb.hidden = false;
  if (ok) {
    if (!st.retry) R.first++;
    fb.className = 'fb ok';
    fb.innerHTML = `${L().right}<span class="it"><span class="tap" role="button" tabindex="0" data-say="${esc(item.it)}">${esc(item.it)}</span></span>${pronHtml(item.it)}`;
  } else {
    fb.className = 'fb bad';
    fb.innerHTML = `${L().correctIs}<span class="it">${correct === item.it ? `<span class="tap" role="button" tabindex="0" data-say="${esc(item.it)}">${esc(correct)}</span>` : esc(correct)}</span>${pronHtml(item.it)}`;
    if (!st.retry) R.steps.push({...st, retry:true});
  }
  sfx(ok ? 'ok' : 'bad');
  setTimeout(() => { if (R && R.steps[R.i] === st) speak(item.it); }, 380);
  setBtn(L().next, 'next');
}
function next(){
  R.i++;
  if (R.i >= R.steps.length) return finish();
  showStep();
}
function finish(){
  const l = R.lesson;
  if (!S.done.includes(l.id)) S.done.push(l.id);
  let added = 0;
  l.items.forEach(x => { if (!S.cards[x.it]) { S.cards[x.it] = {ru:x.ru, box:0, due:Date.now()}; added++; } });
  touchStreak(); save();
  $('#bar').style.width = '100%';
  $('#fb').hidden = true;
  $('#lbody').innerHTML = `<p class="kicker">${L().lessonDone}</p><div class="emblem" aria-hidden="true">🏆</div><h2 class="it big">Bravo!</h2>
    <p class="result">${L().firstTry(R.first, R.total)}</p>
    <p>${added ? L().added(added) : L().reviewedOld}</p>`;
  setBtn(L().finish, 'close');
  sfx('win'); confetti();
}
$('#lbtn').addEventListener('click', () => {
  if (!R) return;
  if (R.mode === 'check') check();
  else if (R.mode === 'next') next();
  else closeLesson();

    <div class="msgs" id="msgs"></div>
    <div class="composer"><p class="cerr" id="cerr"></p><div class="hints" id="hints"></div>
      <div class="crow"><input id="cin" type="text" placeholder="${L().placeholder}" autocomplete="off" autocapitalize="sentences" lang="it" aria-label="${L().msg}"><button class="send" data-action="send" aria-label="${L().send}">${ICON_SEND}</button></div></div>`;
  $('#cin').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
  updateChat();
}
function updateChat(scroll){
  const m = $('#msgs'); if (!m) return;
  m.innerHTML = chat.msgs.map((x, i) => x.who === 'ai'
    ? `<div class="msg ai"><p class="it"><span class="tap" role="button" tabindex="0" data-say="${esc(x.it)}">${esc(x.it)}</span></p><div class="mtools"><button class="say sm" data-say="${esc(x.it)}" aria-label="${L().listen}">${ICON_SAY}</button>${x.tr ? `<button class="link" data-action="tr" data-i="${i}">${x.showTr ? L().hideTr : L().tr}</button>` : ''}</div>${x.showTr ? `<p class="mru">${esc(x.tr)}</p>` : ''}</div>`
    : `<div class="msg me"><p class="it">${esc(x.it)}</p></div>${x.corr ? `<div class="corr"><strong>${L().better}</strong>${esc(x.corr)}</div>` : ''}`
  ).join('') + (chat.busy ? `<div class="typing">${L().typing}</div>` : '');
  $('#hints').innerHTML = chat.busy ? '' : chat.hints.map(h => `<button class="hint" data-action="hint" data-it="${esc(h.it)}"><span class="it">${esc(h.it)}</span><span class="hru">${esc(h.tr || '')}</span></button>`).join('');
  $('#cerr').textContent = chat.err;
  if (scroll !== false) requestAnimationFrame(() => window.scrollTo({top:document.body.scrollHeight}));
}
function openScenario(id){
  const s = SCEN.find(x => x.id === id);
  chat.s = s; chat.err = ''; chat.busy = false;
  chat.msgs = [{who:'ai', it:s.open.it, tr:tr(s.open)}];
  chat.hints = s.hints.map(h => ({it:h.it, tr:tr(h)}));
  renderChat(); speak(s.open.it);
}
function buildPrompt(){
  const hist = chat.msgs.slice(-14).map(m => (m.who === 'ai' ? L().partner : L().you) + m.it).join('\n');
  return L().prompt(S.lang === 'en' ? chat.s.roleEn : chat.s.role, hist);
}
function errText(code){
  if (code === 'not_granted') return L().errGrant;
  if (code === 'rate_limited') return L().errRate;
  if (code === 'cancelled') return '';
  return L().errGeneric;
}
async function send(){
  const inp = $('#cin'); if (!inp || chat.busy) return;
  const text = inp.value.trim(); if (!text) return;
  const sample = await samplerP;
  if (!sample) { chat.err = L().errNoClaude; updateChat(false); return; }
  inp.value = ''; chat.err = '';
  const mine = {who:'me', it:text};
  chat.msgs.push(mine); chat.hints = []; chat.busy = true; updateChat();
  try {
    const res = await sample.json(buildPrompt(), {modelTier:'quick', cache:false});
    if (!res || typeof res.reply !== 'string') throw {code:'bad_response'};
    if (res.correction) mine.corr = String(res.correction);
    chat.msgs.push({who:'ai', it:res.reply, tr:res.reply_tr || ''});
    chat.hints = Array.isArray(res.hints) ? res.hints.filter(h => h && h.it).slice(0, 3) : [];
    touchStreak();
  } catch (e) {
    chat.err = errText(e && e.code);
  } finally {
    chat.busy = false; updateChat();
  }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const sayB = e.target.closest('[data-say]');
  if (sayB) { speak(sayB.dataset.say, sayB, true); return; }
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const a = b.dataset.action;
  if (a === 'tab') setTab(b.dataset.tab);
  else if (a === 'lang') setLang(b.dataset.lang);
  else if (a === 'lesson') startLesson(b.dataset.id);
  else if (a === 'lesson-close') closeLesson();
  else if (a === 'settings') openSettings();
  else if (a === 'settings-close') closeSettings();
  else if (a === 'set-voice') { S.voice = b.dataset.uri; save(); pickVoice(); renderSettings(); previewVoice(b.dataset.uri, null); }
  else if (a === 'preview') previewVoice(b.dataset.uri, b);
  else if (a === 'set-ai') { S.aiVoice = b.dataset.ai; save(); renderSettings(); previewVoice(null, null); }
  else if (a === 'preview-ai') { b.dataset.ai === 'off' ? speakSystem(SAMPLE, b, true) : speak(SAMPLE, b, true, b.dataset.ai); }
  else if (a === 'opt' && R && R.mode === 'check') {
    R.sel = b.dataset.val;
    document.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed', o === b ? 'true' : 'false'));
    $('#lbtn').disabled = false;
    if (b.classList.contains('it')) speak(b.dataset.val);
  }
  else if (a === 'pick' && R && R.mode === 'check') { const id = +b.dataset.id; if (!R.built.includes(id)) { R.built.push(id); speak(R.toks[id].t); renderBuild(); } }
  else if (a === 'unpick' && R && R.mode === 'check') { R.built = R.built.filter(x => x !== +b.dataset.id); renderBuild(); }
  else if (a === 'rv-start') { RV = {queue:shuffle(dueCards()), shown:false, count:0}; renderReview(); }
  else if (a === 'rv-show') { RV.shown = true; speak(RV.queue[0]); renderReview(); }
  else if (a === 'rv-know' || a === 'rv-forget') {
    const k = RV.queue.shift(), c = S.cards[k];
    if (a === 'rv-know') { c.box = Math.min(c.box + 1, INTERVALS.length - 1); c.due = Date.now() + INTERVALS[c.box] * DAY; }
    else { c.box = 0; c.due = Date.now(); RV.queue.push(k); }
    RV.count++; RV.shown = false; touchStreak(); save(); renderReview();
  }
  else if (a === 'rv-stop' || a === 'rv-done') { RV = a === 'rv-stop' && RV && RV.count ? {queue:[], count:RV.count} : null; renderReview(); }
  else if (a === 'scen') openScenario(b.dataset.id);
  else if (a === 'scen-back') { chat.s = null; renderChat(); window.scrollTo(0, 0); }
  else if (a === 'send') send();
  else if (a === 'hint') { const i = $('#cin'); i.value = b.dataset.it.replace(/…$/, ' '); i.focus(); }
  else if (a === 'tr') { const m = chat.msgs[+b.dataset.i]; m.showTr = !m.showTr; updateChat(false); }
});

document.addEventListener('keydown', e => {
  const el = e.target.closest && e.target.closest('.tap[data-say]');
  if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); speak(el.dataset.say, el, true); }
});
applyLang();
renderCourse();
</script>
</body>
